name: Daily Data Generation and Dispatch

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  generate_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pandas openpyxl baostock

    - name: Run data generation script
      run: python merged_stock_analyzer.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stock-kline-data
        path: stock_kline_data.xlsx
        retention-days: 2

    - name: Upload Data to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-data
        files: stock_kline_data.xlsx
        token: ${{ secrets.GITHUB_TOKEN }}
        make_latest: true

    - name: Dispatch Passive-Analysis
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.PAT_TOKEN }}
        repository: cjbcmp/Passive-Analysis
        event-type: stockdata-update
        client-payload: '{"run_id": "${{ github.run_id }}"}'
