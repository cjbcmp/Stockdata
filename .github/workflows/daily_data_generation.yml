name: Daily Data Generation and Dispatch`n`non:`n  schedule:`n    - cron: '0 10 * * 1-5' # 18:00 北京时间`n  workflow_dispatch:`n`njobs:`n  generate_data:`n    runs-on: ubuntu-latest`n    permissions:`n      contents: write`n`n    steps:`n    - name: Checkout repository`n      uses: actions/checkout@v4`n`n    - name: Set up Python`n      uses: actions/setup-python@v5`n      with:`n        python-version: '3.10'`n`n    - name: Cache Python dependencies`n      uses: actions/cache@v4`n      with:`n        path: ~/.cache/pip`n        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}`n        restore-keys: |`n          ${{ runner.os }}-pip-`n`n    - name: Install dependencies`n      run: |`n        python -m pip install --upgrade pip`n        if [ -f requirements.txt ]; then`n            python -m pip install -r requirements.txt`n        fi`n        python -m pip install pandas openpyxl baostock`n`n    - name: Run data generation script`n      run: python merged_stock_analyzer.py`n`n    - name: Upload stock_kline_data.xlsx as artifact`n      uses: actions/upload-artifact@v4`n      with:`n        name: stock-kline-data`n        path: stock_kline_data.xlsx`n        retention-days: 2`n`n    - name: Upload Data to Release`n      uses: softprops/action-gh-release@v2`n      with:`n        tag_name: latest-data`n        files: stock_kline_data.xlsx`n        body: "Automated update: ${{ github.event.head_commit.timestamp }}"`n        token: ${{ secrets.GITHUB_TOKEN }}`n        make_latest: true`n`n    - name: Dispatch event to Passive-Analysis`n      uses: peter-evans/repository-dispatch@v3`n      with:`n        token: ${{ secrets.PAT_TOKEN }}`n        repository: cjbcmp/Passive-Analysis`n        event-type: stockdata-update`n        client-payload: '{"run_id": "${{ github.run_id }}"}'
