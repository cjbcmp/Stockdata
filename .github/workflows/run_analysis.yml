name: Run Stock Analysis

on:
  workflow_dispatch: # ??????
  schedule:
    - cron: '0 22 * * 1-5' # ???????????6???

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -m pip install chinese-calendar pandas openpyxl baostock

    - name: Check if today is a Chinese holiday
      id: check_h
      run: |
        python -c "
        import datetime, os
        from chinese_calendar import is_holiday
        today = datetime.date.today()
        is_h = is_holiday(today)
        print(f'Today is a Chinese holiday: {is_h}')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'is_holiday={str(is_h).lower()}\n')
        "

    - name: Run script
      if: steps.check_h.outputs.is_holiday == 'false'
      run: python merged_stock_analyzer.py

    - name: Upload results
      if: steps.check_h.outputs.is_holiday == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: stock-analysis-results
        path: |
          *.xlsx
        retention-days: 1
